name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        working-directory: ./contracts
        run: forge build

      - name: Test
        working-directory: ./contracts
        run: forge test -vv

      - name: Coverage
        working-directory: ./contracts
        run: forge coverage --report summary

  worker:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy
        working-directory: ./worker
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        working-directory: ./worker
        run: go vet ./...

      - name: Test
        working-directory: ./worker
        run: go test ./...

  build-image:
    runs-on: ubuntu-latest
    needs: [contracts, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t capstone-worker:${{ github.sha }} ./worker
